<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="要事簿">
<meta name="theme-color" content="#1f4a3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
<title>要事簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：上方是一页松绿色的日历牌，中间是当天记录，底部常驻输入栏；重要的事盖一枚朱红印章 */
:root {
  --ground: #eef2ec; --sheet: #fafcf8; --ink: #17302a; --muted: #5a6e64; --line: #d4ded5;
  --band: #1f4a3f; --on-band: #f3f7f0; --on-band-dim: #b1cabe; --band-soft: #2c5c4f;
  --seal: #c5301d; --on-seal: #fff6f0; --scrim: rgba(15, 32, 27, .42);
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1a17; --sheet: #16251f; --ink: #e8f0ea; --muted: #94aa9f; --line: #2a403a;
    --band: #173a30; --on-band: #f0f6f1; --on-band-dim: #a2bdb0; --band-soft: #235245;
    --seal: #e0513c; --on-seal: #fff6f0; --scrim: rgba(0, 0, 0, .58);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1a17; --sheet: #16251f; --ink: #e8f0ea; --muted: #94aa9f; --line: #2a403a;
  --band: #173a30; --on-band: #f0f6f1; --on-band-dim: #a2bdb0; --band-soft: #235245;
  --seal: #e0513c; --on-seal: #fff6f0; --scrim: rgba(0, 0, 0, .58);
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; overflow: hidden; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink);
  font: 16px/1.6 var(--sans); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--band);
}
button, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

#app { display: flex; flex-direction: column; height: var(--app-h, 100%); max-width: 560px; margin-inline: auto; }

/* 日历牌 */
.leaf {
  flex: none; position: relative; background: var(--band); color: var(--on-band);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
  border-radius: 0 0 22px 22px;
}
.leaf-top { display: flex; align-items: center; justify-content: space-between; min-height: 32px; }
.brand { font: 600 15px/1 var(--serif); letter-spacing: .32em; color: var(--on-band-dim); }
.today-btn {
  height: 32px; padding-inline: 13px; border-radius: 16px; font-size: 13px;
  background: var(--band-soft); color: var(--on-band);
}
.date { display: flex; align-items: flex-end; gap: 16px; margin-top: 2px; }
.day-num {
  font: 700 92px/.98 var(--serif); letter-spacing: -.03em; font-variant-numeric: lining-nums;
}
.date-meta { min-width: 0; padding-bottom: 8px; display: grid; gap: 2px; }
.month-pick { position: relative; display: inline-flex; align-items: center; gap: 5px; width: fit-content; font: 600 21px/1.3 var(--serif); }
.month-pick svg { width: 12px; height: 12px; opacity: .75; }
.month-pick input { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); opacity: 0; cursor: pointer; border: 0; padding: 0; font-size: 16px; }
.lunar { font-size: 14px; line-height: 1.5; color: var(--on-band-dim); }

.week { display: flex; align-items: stretch; gap: 2px; margin: 12px -6px 0; }
.week-nav { flex: none; width: 26px; display: grid; place-items: center; color: var(--on-band-dim); }
.week-nav svg { width: 14px; height: 14px; }
.days { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.d {
  display: grid; justify-items: center; gap: 1px; padding: 6px 0 7px; border-radius: 13px;
  color: var(--on-band); transition: background-color .15s;
}
.d small { font-size: 11px; line-height: 1.3; color: var(--on-band-dim); }
.d b { font: 600 17px/1.3 var(--serif); font-variant-numeric: lining-nums; }
.d i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.d.has i { background: var(--on-band-dim); }
.d.imp i { background: #ff8a73; }
.d.now b { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.d.on { background: var(--on-band); color: var(--band); }
.d.on small { color: var(--band); }
.d.on.has i { background: var(--band); }
.d.on.imp i { background: var(--seal); }

/* 当天记录 */
.page { flex: 1; min-height: 0; position: relative; }
.scroll { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.tally { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.demo { margin: 0 0 10px; padding: 9px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; color: var(--muted); border: 1px dashed var(--line); }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li + li { border-top: 1px solid var(--line); }
.note {
  width: 100%; display: grid; grid-template-columns: 46px minmax(0, 1fr) 34px; gap: 8px;
  align-items: start; padding: 14px 0; text-align: left;
}
.note time { font-size: 13px; line-height: 26px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note .txt { font-size: 17px; line-height: 26px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note.imp .txt { font-weight: 600; }
.stamp {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px;
  background: var(--seal); color: var(--on-seal); font: 700 18px/1 var(--serif); transform: rotate(-7deg);
}
.note .stamp { justify-self: end; margin-top: -1px; }
.note.fresh .stamp { animation: press .34s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes press { from { transform: rotate(4deg) scale(1.9); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: 1; } }

.empty { display: grid; justify-items: center; gap: 4px; padding: 44px 16px; text-align: center; }
.empty .stamp { width: 52px; height: 52px; font-size: 31px; border-radius: 10px; background: transparent; color: var(--line); border: 2.5px solid var(--line); margin-bottom: 12px; }
.empty h2 { margin: 0; font: 600 20px/1.4 var(--serif); text-wrap: balance; }
.empty p { margin: 0; font-size: 14px; color: var(--muted); }

.toast {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2;
  display: flex; align-items: center; gap: 12px; white-space: nowrap;
  padding: 8px 8px 8px 16px; border-radius: 22px; font-size: 14px;
  background: var(--ink); color: var(--ground);
}
.toast button { padding: 3px 11px; border-radius: 14px; font-weight: 600; color: var(--ink); background: var(--ground); }

/* 底部输入栏 */
.composer {
  flex: none; display: flex; align-items: flex-end; gap: 8px;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
}
.field {
  flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 4px; padding: 6px;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 24px;
}
.field:focus-within { border-color: var(--band); }
.field textarea {
  flex: 1; min-width: 0; height: 34px; max-height: 112px; padding: 5px 4px; border: 0; outline: 0; resize: none;
  background: transparent; font-size: 16px; line-height: 24px;
}
.field textarea::placeholder { color: var(--muted); }
.seal-btn {
  flex: none; width: 34px; height: 34px; display: grid; place-items: center;
}
.seal-btn span {
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 5px; transform: rotate(-7deg);
  font: 700 16px/1 var(--serif); color: var(--muted); border: 1.5px solid var(--muted);
}
.seal-btn[aria-pressed="true"] span { background: var(--seal); border-color: var(--seal); color: var(--on-seal); }
.send {
  flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: var(--band); color: var(--on-band); transition: opacity .15s;
}
.send svg { width: 20px; height: 20px; }
.send:disabled { opacity: .35; cursor: default; }

/* 编辑面板 */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.panel {
  width: 100%; max-width: 560px; max-height: 90%; display: grid; gap: 12px; background: var(--sheet); color: var(--ink);
  border-radius: 22px 22px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: rise .2s ease-out;
}
@keyframes rise { from { transform: translateY(32px); } to { transform: none; } }
.panel-head { display: flex; align-items: center; justify-content: space-between; }
.panel-head h2 { margin: 0; font: 600 18px/1.4 var(--serif); }
.panel-head span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.panel textarea {
  width: 100%; min-height: 128px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; outline: 0; resize: none;
  background: var(--ground); font-size: 17px; line-height: 26px;
}
.panel textarea:focus { border-color: var(--band); }
.mark { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; text-align: left; font-size: 15px; }
.mark .seal-btn { pointer-events: none; }
.panel-actions { display: flex; align-items: center; gap: 8px; }
.panel-actions button { height: 46px; padding-inline: 20px; border-radius: 23px; font-size: 16px; }
.panel-actions .del { color: var(--seal); padding-inline: 4px; margin-right: auto; }
.cancel { color: var(--muted); }
.save { background: var(--band); color: var(--on-band); font-weight: 600; }

@media (max-height: 620px) {
  .day-num { font-size: 64px; }
  .date-meta { padding-bottom: 4px; }
  .week { margin-top: 8px; }
}
.typing .leaf-top, .typing .date { display: none; }
.typing .week { margin-top: 0; }
@media (prefers-reduced-motion: reduce) {
  .note.fresh .stamp, .panel { animation: none; }
  .d, .send { transition: none; }
}
</style>

<div id="app">
  <header class="leaf">
    <div class="leaf-top">
      <span class="brand">要事簿</span>
      <button class="today-btn" id="todayBtn" type="button" hidden>回到今天</button>
    </div>
    <div class="date">
      <div class="day-num" id="dayNum"></div>
      <div class="date-meta">
        <label class="month-pick">
          <span id="monthLabel"></span>
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg>
          <input type="date" id="picker" aria-label="选择日期">
        </label>
        <div class="lunar" id="lunar"></div>
      </div>
    </div>
    <nav class="week" aria-label="选择这一周的日期">
      <button class="week-nav" id="prevWeek" type="button" aria-label="上一周">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2L4 7l5 5"/></svg>
      </button>
      <div class="days" id="days"></div>
      <button class="week-nav" id="nextWeek" type="button" aria-label="下一周">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2l5 5-5 5"/></svg>
      </button>
    </nav>
  </header>

  <main class="page">
    <div class="scroll" id="scroll">
      <p class="demo" id="notice" hidden></p>
      <p class="tally" id="tally"></p>
      <ul class="notes" id="notes"></ul>
      <div class="empty" id="empty" hidden>
        <span class="stamp" aria-hidden="true">要</span>
        <h2>这一天还空着</h2>
        <p>在下面写下最重要的一件事</p>
      </div>
    </div>
    <div class="toast" id="toast" role="status" hidden>
      <span id="toastText"></span>
      <button id="undo" type="button">撤销</button>
    </div>
  </main>

  <form class="composer" id="composer">
    <div class="field">
      <button class="seal-btn" id="composeSeal" type="button" aria-pressed="false" aria-label="标记为重要"><span>要</span></button>
      <textarea id="input" rows="1" placeholder="记下今天重要的事" aria-label="新记录"></textarea>
    </div>
    <button class="send" id="send" type="submit" aria-label="保存记录" disabled>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4M4.5 9.5L10 4l5.5 5.5"/></svg>
    </button>
  </form>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head">
      <h2 id="panelTitle">修改记录</h2>
      <span id="panelTime"></span>
    </div>
    <textarea id="editText" aria-label="记录内容"></textarea>
    <button class="mark" id="editSeal" type="button" aria-pressed="false">
      <span class="seal-btn" id="editSealIcon" aria-pressed="false"><span>要</span></span>
      <span id="editSealText">盖章，标记为重要</span>
    </button>
    <div class="panel-actions">
      <button class="del" id="editDel" type="button">删除</button>
      <button class="cancel" id="editCancel" type="button">取消</button>
      <button class="save" type="submit">保存</button>
    </div>
  </form>
</div>

<script>
(function () {
  var KEY = 'yaoshibu-notes-v1';
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var MONTH = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
  var $ = function (id) { return document.getElementById(id); };

  var data = {};
  var storageOk = true;
  var today = keyOf(new Date());
  var selected = today;
  var composeImp = false;
  var editing = null;
  var editImp = false;
  var freshId = null;
  var undoAction = null;
  var toastTimer = 0;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dateOf(key) { var p = key.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function shift(key, days) { var d = dateOf(key); d.setDate(d.getDate() + days); return keyOf(d); }
  function nowTime() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function lunarText(d) {
    try {
      var parts = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { month: 'long', day: 'numeric' }).formatToParts(d);
      var m = '', day = '';
      parts.forEach(function (p) { if (p.type === 'month') m = p.value; if (p.type === 'day') day = p.value; });
      if (/^\d+$/.test(day)) {
        var n = +day, ten = ['初', '十', '廿', '三'], one = '一二三四五六七八九十';
        day = n === 10 ? '初十' : n === 20 ? '二十' : n === 30 ? '三十' : ten[Math.floor(n / 10)] + one[(n - 1) % 10];
      }
      return m && day ? '农历' + m + day : '';
    } catch (e) { return ''; }
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { storageOk = false; }
    if (raw) {
      try { data = JSON.parse(raw) || {}; } catch (e) { data = {}; }
    } else if (raw === null) {
      data[today] = [
        { id: uid(), time: '09:30', text: '交房租，今晚十二点前转账', imp: true, sample: true },
        { id: uid(), time: '14:00', text: '下午和小林对一下项目进度', imp: false, sample: true },
        { id: uid(), time: '20:15', text: '买明早的牛奶和鸡蛋', imp: false, sample: true }
      ];
    }
  }

  function save() {
    var clean = {};
    Object.keys(data).forEach(function (k) {
      var list = data[k].filter(function (n) { return !n.sample; });
      if (list.length) clean[k] = list;
    });
    try { localStorage.setItem(KEY, JSON.stringify(clean)); storageOk = true; } catch (e) { storageOk = false; }
  }

  function dropSamples() {
    Object.keys(data).forEach(function (k) {
      data[k] = data[k].filter(function (n) { return !n.sample; });
    });
  }

  function hasSamples() {
    return Object.keys(data).some(function (k) { return data[k].some(function (n) { return n.sample; }); });
  }

  function notesOf(key) {
    return (data[key] || []).slice().sort(function (a, b) { return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
  }

  function renderHeader() {
    var d = dateOf(selected);
    $('dayNum').textContent = d.getDate();
    $('monthLabel').textContent = MONTH[d.getMonth()] + ' · 星期' + WEEK[d.getDay()];
    var lunar = lunarText(d);
    var year = d.getFullYear() !== dateOf(today).getFullYear() ? d.getFullYear() + '年 ' : '';
    $('lunar').textContent = year + lunar;
    $('picker').value = selected;
    $('todayBtn').hidden = selected === today;
  }

  function renderWeek() {
    var d = dateOf(selected);
    var offset = (d.getDay() + 6) % 7;
    var box = $('days');
    box.textContent = '';
    for (var i = 0; i < 7; i++) {
      var k = shift(selected, i - offset);
      var cell = dateOf(k);
      var list = data[k] || [];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'd' + (k === selected ? ' on' : '') + (k === today ? ' now' : '') + (list.length ? ' has' : '') +
        (list.some(function (n) { return n.imp; }) ? ' imp' : '');
      b.setAttribute('aria-label', (cell.getMonth() + 1) + '月' + cell.getDate() + '日，星期' + WEEK[cell.getDay()] +
        (list.length ? '，' + list.length + '条记录' : ''));
      if (k === selected) b.setAttribute('aria-current', 'date');
      b.dataset.key = k;
      var s = document.createElement('small'); s.textContent = WEEK[cell.getDay()];
      var n = document.createElement('b'); n.textContent = cell.getDate();
      b.appendChild(s); b.appendChild(n); b.appendChild(document.createElement('i'));
      box.appendChild(b);
    }
  }

  function dayName() {
    if (selected === today) return '今天';
    if (selected === shift(today, -1)) return '昨天';
    if (selected === shift(today, 1)) return '明天';
    var d = dateOf(selected);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function renderList() {
    var list = notesOf(selected);
    var ul = $('notes');
    ul.textContent = '';
    list.forEach(function (n) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'note' + (n.imp ? ' imp' : '') + (n.id === freshId ? ' fresh' : '');
      b.dataset.id = n.id;
      var t = document.createElement('time'); t.textContent = n.time;
      var x = document.createElement('span'); x.className = 'txt'; x.textContent = n.text;
      b.appendChild(t); b.appendChild(x);
      if (n.imp) {
        var s = document.createElement('span');
        s.className = 'stamp'; s.textContent = '要'; s.setAttribute('aria-label', '重要');
        b.appendChild(s);
      }
      li.appendChild(b);
      ul.appendChild(li);
    });
    freshId = null;
    var count = list.length;
    var imp = list.filter(function (n) { return n.imp; }).length;
    $('tally').hidden = !count;
    $('tally').textContent = dayName() + ' ' + count + ' 件事' + (imp ? '，' + imp + ' 件要紧' : '');
    $('empty').hidden = !!count;
    var notice = $('notice');
    if (!storageOk) {
      notice.hidden = false;
      notice.textContent = '现在无法保存到这台手机，关闭后内容会丢失。请退出无痕浏览后再试。';
    } else if (hasSamples()) {
      notice.hidden = false;
      notice.textContent = '下面是示例内容。记下第一件事后，示例会自动清除。';
    } else {
      notice.hidden = true;
    }
    $('input').placeholder = selected === today ? '记下今天重要的事' : '记下' + dayName() + '重要的事';
  }

  function render() { renderHeader(); renderWeek(); renderList(); }

  function select(key) {
    selected = key;
    render();
    $('scroll').scrollTop = 0;
  }

  function growInput() {
    var el = $('input');
    el.style.height = '34px';
    el.style.height = Math.min(el.scrollHeight, 112) + 'px';
    $('send').disabled = !el.value.trim();
  }

  function setComposeImp(on) {
    composeImp = on;
    $('composeSeal').setAttribute('aria-pressed', String(on));
  }

  function add() {
    var el = $('input');
    var text = el.value.trim();
    if (!text) return;
    dropSamples();
    var note = { id: uid(), time: nowTime(), text: text, imp: composeImp };
    (data[selected] = data[selected] || []).push(note);
    if (note.imp) freshId = note.id;
    save();
    el.value = '';
    setComposeImp(false);
    growInput();
    render();
    var s = $('scroll');
    s.scrollTop = s.scrollHeight;
  }

  function findNote(id) {
    var list = data[selected] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function setEditImp(on) {
    editImp = on;
    $('editSeal').setAttribute('aria-pressed', String(on));
    $('editSealIcon').setAttribute('aria-pressed', String(on));
    $('editSealText').textContent = on ? '已盖章，这件事很重要' : '盖章，标记为重要';
  }

  function openEditor(note) {
    editing = note;
    $('editText').value = note.text;
    $('panelTime').textContent = dayName() + ' ' + note.time;
    setEditImp(!!note.imp);
    $('scrim').hidden = false;
  }

  function closeEditor() {
    editing = null;
    $('scrim').hidden = true;
  }

  function saveEdit() {
    var text = $('editText').value.trim();
    if (!text) { $('editText').focus(); return; }
    var wasImp = editing.imp;
    if (editing.sample) {
      /* 改过的示例算作用户自己的记录，其余示例清除 */
      delete editing.sample;
      dropSamples();
    }
    editing.text = text;
    editing.imp = editImp;
    if (editImp && !wasImp) freshId = editing.id;
    save();
    closeEditor();
    render();
  }

  function deleteEditing() {
    var note = editing, day = selected;
    var at = data[day].indexOf(note);
    data[day].splice(at, 1);
    save();
    closeEditor();
    render();
    showToast('已删除', function () {
      data[day].splice(at, 0, note);
      save();
      render();
    });
  }

  function showToast(text, undo) {
    $('toastText').textContent = text;
    undoAction = undo;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').hidden = true; undoAction = null; }, 5000);
  }

  /* 键盘弹出时让整个界面收进可视区域，并收起大日期给记录让位 */
  function fitViewport() {
    var vv = window.visualViewport;
    if (!vv) return;
    var root = document.documentElement;
    var open = window.innerHeight - vv.height > 120;
    if (open) {
      var top = parseFloat(getComputedStyle(root).paddingTop) || 0;
      root.style.setProperty('--app-h', (vv.height - top) + 'px');
      window.scrollTo(0, 0);
    } else {
      root.style.removeProperty('--app-h');
    }
    $('app').classList.toggle('typing', open && document.activeElement === $('input'));
  }

  function refreshDay() {
    var now = keyOf(new Date());
    if (now === today) return;
    if (selected === today) selected = now;
    today = now;
    render();
  }

  $('days').addEventListener('click', function (e) {
    var b = e.target.closest('.d');
    if (b) select(b.dataset.key);
  });
  $('prevWeek').addEventListener('click', function () { select(shift(selected, -7)); });
  $('nextWeek').addEventListener('click', function () { select(shift(selected, 7)); });
  $('todayBtn').addEventListener('click', function () { select(today); });
  $('picker').addEventListener('change', function () { if (this.value) select(this.value); });
  $('picker').addEventListener('click', function () { try { this.showPicker(); } catch (e) {} });

  $('notes').addEventListener('click', function (e) {
    var b = e.target.closest('.note');
    if (!b) return;
    var n = findNote(b.dataset.id);
    if (n) openEditor(n);
  });

  $('composer').addEventListener('submit', function (e) { e.preventDefault(); add(); $('input').focus(); });
  $('input').addEventListener('input', growInput);
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer: fine)').matches) {
      e.preventDefault();
      add();
    }
  });
  $('input').addEventListener('focus', fitViewport);
  $('input').addEventListener('blur', function () { setTimeout(fitViewport, 60); });
  $('composeSeal').addEventListener('click', function () { setComposeImp(!composeImp); $('input').focus(); });

  $('panel').addEventListener('submit', function (e) { e.preventDefault(); saveEdit(); });
  $('editSeal').addEventListener('click', function () { setEditImp(!editImp); });
  $('editCancel').addEventListener('click', closeEditor);
  $('editDel').addEventListener('click', deleteEditing);
  $('scrim').addEventListener('click', function (e) { if (e.target === this) closeEditor(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && editing) closeEditor(); });

  $('undo').addEventListener('click', function () {
    if (undoAction) undoAction();
    undoAction = null;
    clearTimeout(toastTimer);
    $('toast').hidden = true;
  });

  /* 在记录区左右滑动切换前后一天 */
  var sx = 0, sy = 0, tracking = false;
  $('scroll').addEventListener('touchstart', function (e) {
    tracking = e.touches.length === 1;
    if (tracking) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
  }, { passive: true });
  $('scroll').addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45) select(shift(selected, dx < 0 ? 1 : -1));
  }, { passive: true });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitViewport);
    window.visualViewport.addEventListener('scroll', function () { if (window.scrollY) window.scrollTo(0, 0); });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshDay(); });

  load();
  render();
  growInput();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</html>
